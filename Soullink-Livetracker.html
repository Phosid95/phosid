<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soullink Echtzeit-Tracker</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        #progress-container { width: 100%; height: 5px; background: #222; position: fixed; top: 0; z-index: 1000; }
        #progress-bar { width: 100%; height: 100%; background: #ffcb05; box-shadow: 0 0 10px #ffcb05; transition: width 1s linear; }
        h1 { color: #ffcb05; text-shadow: 3px 3px #3b4cca; margin-top: 30px; font-size: 2.5em; }
        #last-update { font-size: 0.85em; color: #888; margin-bottom: 20px; }
        #dashboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; max-width: 1400px; }
        .card { background: #1e1e1e; border: 2px solid #333; border-radius: 15px; width: 280px; box-shadow: 0 8px 16px rgba(0,0,0,0.6); overflow: hidden; }
        .route-header { background: #333; color: #ddd; font-size: 0.75em; font-weight: bold; padding: 8px; text-align: center; text-transform: uppercase; border-bottom: 1px solid #444; }
        .card-content { padding: 15px; }
        .pair { display: flex; justify-content: space-between; align-items: center; }
        .slot { flex: 1; text-align: center; }
        .slot img { width: 80px; height: 80px; image-rendering: pixelated; margin-bottom: 5px; }
        .name { font-weight: bold; color: #ffcb05; font-size: 0.95em; }
        .user-tag { font-size: 0.65em; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
        .link-icon { font-size: 1.5em; color: #ff4444; }
        .update-flash { color: #00ff00 !important; font-weight: bold; }
    </style>
</head>
<body>

    <div id="progress-container"><div id="progress-bar"></div></div>
    <h1>Soullink Live Tracker</h1>
    <div id="last-update">Verbinde mit Google API...</div>
    <div id="dashboard"></div>

    <script>
        // HIER DEINE WEB-APP URL AUS GOOGLE APPS SCRIPT EINFÜGEN
        const API_URL = 'https://script.google.com/macros/s/AKfycbxSB2hu6jWcDEDP0onx8IqBAdY49URenMbM8UdN7El921Lg6fQeq1pP86Y9r-yG5D-O/exec';
        
        const REFRESH_SECONDS = 30; 
        let secondsLeft = REFRESH_SECONDS;

        async function update() {
            const statusLabel = document.getElementById('last-update');
            const board = document.getElementById('dashboard');

            try {
                // Keine Cache-Buster mehr nötig, da wir direkt die API aufrufen
                const response = await fetch(API_URL);
                const data = await response.json(); // Wir bekommen ein 2 dimensionales Array [[R1,C1,C2...], [R2,C1...]]

                if (!data || data.length < 1) return;

                const player1 = data[0][1] || "Jan";
                const player2 = data[0][2] || "Tom";
                
                let htmlBuffer = "";

                for (let i = 1; i < data.length; i++) {
                    const cols = data[i];
                    const location = cols[0];
                    const p1 = cols[1];
                    const p2 = cols[2];
                    const status = cols[3];

                    // Checkboxen in Google Apps Script kommen als echte Booleans (true/false) an
                    if ((status === true || status === "TRUE") && p1 && p1.toLowerCase() !== "starter") {
                        htmlBuffer += `
                            <div class="card">
                                <div class="route-header">${location}</div>
                                <div class="card-content">
                                    <div class="pair">
                                        <div class="slot">
                                            <div class="user-tag">${player1}</div>
                                            <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/${p1.toLowerCase().replace('.','').replace(' ','-')}.gif" onerror="this.style.visibility='hidden'">
                                            <div class="name">${p1}</div>
                                        </div>
                                        <div class="link-icon">🔗</div>
                                        <div class="slot">
                                            <div class="user-tag">${player2}</div>
                                            <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/${p2.toLowerCase().replace('.','').replace(' ','-')}.gif" onerror="this.style.visibility='hidden'">
                                            <div class="name">${p2}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>`;
                    }
                }

                board.innerHTML = htmlBuffer || "<p>Keine aktiven Paare.</p>";
                statusLabel.innerText = `Echtzeit-Sync: ${new Date().toLocaleTimeString()} | ${player1} & ${player2}`;
                statusLabel.classList.add('update-flash');
                setTimeout(() => statusLabel.classList.remove('update-flash'), 1000);
                
                secondsLeft = REFRESH_SECONDS; 

            } catch (e) {
                console.error("API Fehler:", e);
                statusLabel.innerText = "API-Fehler - Prüfe die Web-App URL!";
            }
        }

        setInterval(() => {
            secondsLeft--;
            document.getElementById('progress-bar').style.width = (secondsLeft / REFRESH_SECONDS * 100) + "%";
            if (secondsLeft <= 0) update();
        }, 1000);

        update();
    </script>
</body>
</html>
