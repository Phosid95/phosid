<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soullink Live-Tracker Pro</title>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* Progress Bar */
        #progress-container { 
            width: 100%; height: 5px; background: #222; position: fixed; top: 0; left: 0; z-index: 1000; 
        }
        #progress-bar { 
            width: 100%; height: 100%; background: #ffcb05; box-shadow: 0 0 10px #ffcb05; transition: width 1s linear; 
        }

        h1 { color: #ffcb05; text-shadow: 3px 3px #3b4cca; margin-top: 40px; margin-bottom: 5px; font-size: 2.5em; }
        #last-update { font-size: 0.85em; color: #888; margin-bottom: 20px; }
        .update-flash { color: #00ff00 !important; font-weight: bold; }

        /* Dashboard Layout */
        #dashboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; padding: 20px; max-width: 95%; }

        .card { 
            background: #1e1e1e; border: 2px solid #333; border-radius: 15px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.6); overflow: hidden; 
            transition: transform 0.2s ease; min-width: 300px;
        }
        .card:hover { transform: translateY(-5px); }

        .route-header { 
            background: #333; color: #ddd; font-size: 0.75em; font-weight: bold; padding: 10px; 
            text-align: center; text-transform: uppercase; border-bottom: 1px solid #444;
        }

        .card-content { padding: 15px; }
        .pair { display: flex; justify-content: center; align-items: center; gap: 10px; }
        .slot { flex: 1; text-align: center; min-width: 110px; }
        
        .slot img.poke-sprite { 
            width: 80px; height: 80px; image-rendering: auto; margin-bottom: 5px; object-fit: contain; 
        }

        .name { font-weight: bold; color: #ffcb05; font-size: 0.95em; margin-bottom: 8px; }
        
        /* NEU: Container für Typ-Bilder */
        .type-container { 
            display: flex; 
            justify-content: center; 
            gap: 4px; 
            height: 20px; 
            margin-top: 2px;
        }
        .type-icon { 
            height: 18px; 
            width: auto; 
            filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));
        }

        .user-tag { font-size: 0.6em; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
        .link-icon { font-size: 1.2em; color: #ff4444; }
        .empty-msg { color: #555; margin-top: 50px; font-style: italic; }
    </style>
</head>
<body>

    <div id="progress-container"><div id="progress-bar"></div></div>
    <h1>Soullink Tracker</h1>
    <div id="last-update">Initialisiere Pokédex...</div>
    <div id="dashboard"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxSB2hu6jWcDEDP0onx8IqBAdY49URenMbM8UdN7El921Lg6fQeq1pP86Y9r-yG5D-O/exec'; 
        const REFRESH_SECONDS = 30;
        const MISSING_NO_URL = "https://www.pngkey.com/png/full/343-3434526_missingno-missingno-sprite.png";
        
        let pokemonMap = {}; 
        let secondsLeft = REFRESH_SECONDS;

        function superClean(str) {
            return String(str).toLowerCase().replace(/[\s\t\n\r]/g, '').trim();
        }

        // NEU: Funktion um Icons basierend auf dem Typ-String zu generieren
        function getTypeIconsHTML(typeString) {
            if (!typeString || typeString === "???" || typeString === "Unbekannt") return "";
            
            // Trennt "Pflanze Gift" oder "Pflanze / Gift" in einzelne Wörter
            const types = typeString.split(/[\s/]+/).filter(t => t.length > 0);
            
            return types.map(t => {
                const cleanT = superClean(t);
                // Erwartet die Bilder im Unterordner types/ (z.B. types/wasser.png)
                return `<img src="types/${cleanT}.png" class="type-icon" title="${t}" onerror="this.style.display='none'">`;
            }).join('');
        }

        async function loadTranslations() {
            try {
                // Nutze den Namen deiner aktuellen Datei
                const response = await fetch('pokemon_with_types.json?v=' + Date.now());
                if (!response.ok) throw new Error("JSON konnte nicht geladen werden");
                const data = await response.json();
                let rawMap = data.pokemon ? data.pokemon : data;

                pokemonMap = {};
                for (let key in rawMap) {
                    pokemonMap[superClean(key)] = rawMap[key];
                }
                console.log("Pokédex-Daten geladen.");
            } catch (e) {
                console.error("Übersetzungs-Fehler:", e);
            }
        }

        function handleImgError(imgElement, enName) {
            if (imgElement.src.includes('black-white')) {
                imgElement.src = `https://img.pokemondb.net/sprites/scarlet-violet/normal/${enName}.png`;
            } 
            else if (imgElement.src.includes('scarlet-violet')) {
                imgElement.src = `https://img.pokemondb.net/sprites/x-y/normal/${enName}.png`;
            }
            else {
                imgElement.src = MISSING_NO_URL;
                imgElement.onerror = null;
            }
        }

        async function update() {
            const statusLabel = document.getElementById('last-update');
            const board = document.getElementById('dashboard');

            try {
                const response = await fetch(API_URL);
                const data = await response.json(); 
                if (!data || data.length < 1) return;

                const headerRow = data[0];
                const statusColIdx = headerRow.findIndex(cell => 
                    String(cell).trim().toUpperCase().startsWith("GÜLTIG")
                );

                const playerNames = [];
                for (let col = 1; col < statusColIdx; col++) {
                    if (headerRow[col]) playerNames.push(headerRow[col]);
                }
                
                let htmlBuffer = "";

                for (let i = 1; i < data.length; i++) {
                    const row = data[i];
                    const status = row[statusColIdx];
                    const isTrue = (status === true || String(status).toUpperCase() === 'TRUE' || String(status).toUpperCase() === 'WAHR');
                    
                    if (isTrue && row[1] && String(row[1]).toLowerCase() !== "starter") {
                        let playerSlotsHtml = "";
                        
                        for (let pIdx = 0; pIdx < playerNames.length; pIdx++) {
                            const deNameRaw = String(row[pIdx + 1]).trim();
                            const deNameClean = superClean(deNameRaw);
                            
                            const pokeData = pokemonMap[deNameClean];
                            const enName = pokeData ? (pokeData.en || deNameClean) : deNameClean;
                            const pType = pokeData ? (pokeData.type || "Unbekannt") : "???";

                            const imgName = String(enName).toLowerCase().trim()
                                            .replace(/\s+/g, '-')
                                            .replace(/\./g, '')
                                            .replace('♀', '-f')
                                            .replace('♂', '-m');

                            const startUrl = `https://img.pokemondb.net/sprites/black-white/anim/normal/${imgName}.gif`;

                            playerSlotsHtml += `
                                <div class="slot">
                                    <div class="user-tag">${playerNames[pIdx]}</div>
                                    <img src="${startUrl}" class="poke-sprite" onerror="handleImgError(this, '${imgName}')">
                                    <div class="name">${deNameRaw}</div>
                                    <div class="type-container">${getTypeIconsHTML(pType)}</div>
                                </div>
                                ${pIdx < playerNames.length - 1 ? '<div class="link-icon">🔗</div>' : ''}
                            `;
                        }

                        const cardWidth = Math.max(300, playerNames.length * 150);
                        htmlBuffer += `
                            <div class="card" style="width: ${cardWidth}px;">
                                <div class="route-header">${row[0]}</div>
                                <div class="card-content"><div class="pair">${playerSlotsHtml}</div></div>
                            </div>`;
                    }
                }

                board.innerHTML = htmlBuffer || "<p class='empty-msg'>Keine aktiven Paare gefunden.</p>";
                statusLabel.innerText = `Echtzeit-Sync: ${new Date().toLocaleTimeString()} | Spieler: ${playerNames.join(' & ')}`;
                
                secondsLeft = REFRESH_SECONDS; 
            } catch (e) {
                console.error("Update Fehler:", e);
                statusLabel.innerText = "Verbindung unterbrochen...";
            }
        }

        async function init() {
            await loadTranslations(); 
            await update();                 
            setInterval(() => {
                secondsLeft--;
                if (secondsLeft < 0) secondsLeft = 0;
                const bar = document.getElementById('progress-bar');
                if (bar) bar.style.width = (secondsLeft / REFRESH_SECONDS * 100) + "%";
                if (secondsLeft === 0) update();
            }, 1000);
        }
        init();
    </script>
</body>
</html>
