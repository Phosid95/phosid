<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soullink Genlocke Tracker</title>
    <style>
        /* Grundlegendes Styling */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1, h3 { color: #fff; text-align: center; }
        #loading-bar-container { width: 100%; background-color: #222; height: 5px; position: fixed; top: 0; left: 0; z-index: 1000; }
        #loading-bar { width: 0%; height: 100%; background-color: #00e676; transition: width 0.3s ease; }
        
        /* Dropdown Styling */
        .gen-selector-container { text-align: center; margin: 20px 0; background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .gen-selector-container label { font-weight: bold; margin-right: 10px; color: #00e676; }
        #gen-select { padding: 8px 15px; border-radius: 5px; font-size: 16px; cursor: pointer; background: #2a2a2a; color: #fff; border: 1px solid #444; }
        
        /* Dashboard & Karten Layout */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px 0; }
        .card { background-color: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); overflow: hidden; border: 1px solid #333; }
        .dead-card { opacity: 0.6; filter: grayscale(80%); border-left: 5px solid #d32f2f; }
        .route-header { background-color: #2a2a2a; padding: 10px; font-weight: bold; text-align: center; border-bottom: 1px solid #333; }
        .card-content { padding: 15px; }
        .pair { display: flex; align-items: center; justify-content: space-around; }
        .slot { text-align: center; width: 45%; }
        .user-tag { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 5px; }
        .poke-sprite { max-width: 60px; height: auto; }
        .name { font-weight: bold; margin: 5px 0; font-size: 14px; }
        .link-icon { font-size: 20px; color: #00e676; }
        
        /* Statistik-Balken */
        .stat-row { margin: 10px 0; }
        .stat-label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        .bar-bg { background-color: #333; height: 15px; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease; }
        
        /* Eure individuellen Spielerfarben 🎨 */
        .riirex-bar { background-color: #00b0ff; } /* Blau für Riirex */
        .zepho-bar { background-color: #ec407a; }  /* Rosa/Rot für Zepho */
        
        .type-stat-card { display: inline-flex; align-items: center; background: #2a2a2a; padding: 5px 10px; margin: 5px; border-radius: 4px; border-left: 4px solid #555; }
        .type-icon { width: 16px; height: 16px; margin-right: 5px; }
    </style>
</head>
<body>

    <div id="loading-bar-container"><div id="loading-bar"></div></div>

    <h1>Soullink Genlocke Tracker</h1>

    <!-- Dropdown-Menü für alle 9 Generationen -->
    <div class="gen-selector-container">
        <label for="gen-select">📌 Aktuelle Generation:</label>
        <select id="gen-select" onchange="changeGeneration()">
            <option value="Gen1" selected>Generation 1 (Kanto)</option>
            <option value="Gen2">Generation 2 (Johto)</option>
            <option value="Gen3">Generation 3 (Hoenn)</option>
            <option value="Gen4">Generation 4 (Sinnoh)</option>
            <option value="Gen5">Generation 5 (Unova)</option>
            <option value="Gen6">Generation 6 (Kalos)</option>
            <option value="Gen7">Generation 7 (Alola)</option>
            <option value="Gen8">Generation 8 (Galar)</option>
            <option value="Gen9">Generation 9 (Paldea)</option>
        </select>
        <div id="last-update" style="font-size: 12px; color: #888; margin-top: 5px;">Sync: -</div>
    </div>

    <h3>👥 Aktives Team</h3>
    <div id="dashboard" class="grid-container"><p>Lade Pokémon...</p></div>

    <h3>💀 Gefallene Pokémon (Friedhof)</h3>
    <div id="graveyard-list" class="grid-container"><p>In diesem Run gab es noch keine Verluste.</p></div>

    <h3>📊 Statistiken (Death Counter)</h3>
    <div id="death-bars" style="max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px;"></div>
    
    <h3>🌋 Wipeouts</h3>
    <div id="wipeout-bars" style="max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; margin-top: 10px;"></div>

    <h3>🔥 Typen-Verteilung im Team</h3>
    <div id="type-distribution" style="text-align: center; padding: 10px;"></div>

    <script>
        // Eure neue, aktualisierte Web-App-URL von Google
        const API_URL = "https://script.google.com/macros/s/AKfycbz5vwDU1R-nWHtTfhZecxLKOz3yTrKVnGEOEAUcHiDcl7TkOAm3c-heoJTCPCfhAA7gMg/exec";

        // Dummy-Daten falls die PokéAPI/Lokale Zuordnung fehlt
        const pokemonMap = {}; 
        const typeColors = { feuer: '#ff9800', wasser: '#2196f3', pflanze: '#4caf50', normal: '#9e9e9e' };

        function superClean(str) { return str.toLowerCase().trim().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss'); }
        function getTypeIconsHTML(typeStr) { return `<span style="font-size:12px; color:#aaa;">${typeStr}</span>`; }
        function handleImgError(img, name) { img.src = "https://img.pokemondb.net/sprites/sword-shield/icon/bulbasaur.png"; }
        function calculateRadar(data) { /* Optionale Logik */ }

        // Wenn das Dropdown geändert wird, laden wir die Daten neu
        function changeGeneration() {
            update();
        }

        async function update() {
            const bar = document.getElementById('loading-bar');
            bar.style.width = "30%";
            try {
                // Holt den Namen des ausgewählten Tabellenblatts (z.B. Gen1, Gen2)
                const selectedGen = document.getElementById('gen-select').value;
                const fetchUrl = `${API_URL}${API_URL.includes('?') ? '&' : '?'}sheet=${selectedGen}`;
                
                const response = await fetch(fetchUrl, { method: "GET", redirect: "follow" });
                const json = await response.json();
                bar.style.width = "70%";
                
                const pairs = json.pairs;
                if (!pairs || pairs.length === 0) return;

                // Dynamische Suche nach der Gültig-Spalte
                const statusIdx = pairs[0].findIndex(c => String(c).toUpperCase().includes("GÜLTIG"));
                
                // Spielernamen aus der Tabelle auslesen (Spalte B und C)
                const pNames = [];
                for(let col = 1; col < statusIdx; col++) {
                    if(pairs[0][col]) pNames.push(pairs[0][col]);
                }

                let teamHtml = ""; let graveHtml = ""; let teamDataForRadar = []; let typeCounts = {};

                for (let i = 1; i < pairs.length; i++) {
                    const row = pairs[i]; 
                    if (!row || !row[0]) continue;
                    
                    const alive = (row[statusIdx] === true || String(row[statusIdx]).toUpperCase() === 'TRUE');
                    let slots = "";

                    for (let p = 0; p < pNames.length; p++) {
                        const rawName = String(row[p+1]).trim();
                        if(!rawName) continue;
                        
                        const info = pokemonMap[superClean(rawName)] || { en: rawName, type: "Normal" };
                        const img = info.en.toLowerCase()
                                            .replace(/\. /g, '-')      
                                            .replace(/\s+/g, '-')      
                                            .replace(/\./g, '')        
                                            .replace(/'/g, '')         
                                            .replace('♀','-f')
                                            .replace('♂','-m');
                        
                        if(alive && info.type !== "???") {
                            teamDataForRadar.push({ name: rawName, typeString: info.type });
                            info.type.split(/[\s/]+/).forEach(t => { 
                                let ct = superClean(t); 
                                typeCounts[ct] = (typeCounts[ct] || 0) + 1; 
                            });
                        }

                        slots += `
                            <div class="slot">
                                <div class="user-tag">${pNames[p]}</div>
                                <a href="https://www.pokewiki.de/${rawName.replace(/\s+/g, '-')}" target="_blank">
                                    <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/${img}.gif" class="poke-sprite" onerror="handleImgError(this, '${img}')">
                                </a>
                                <div class="name">${rawName}</div>
                                <div class="type-container">${getTypeIconsHTML(info.type)}</div>
                            </div>
                            \${p < pNames.length - 1 ? '<div class="link-icon">🔗</div>' : ''}`;
                    }

                    const html = `<div class="card \${alive ? '' : 'dead-card'}"><div class="route-header">\${row[0]}</div><div class="card-content"><div class="pair">\${slots}</div></div></div>`;
                    if(alive) teamHtml += html; else graveHtml += html;
                }

                document.getElementById('dashboard').innerHTML = teamHtml || "<p>Keine aktiven Pokémon.</p>";
                document.getElementById('graveyard-list').innerHTML = graveHtml || "<p>Keine Verluste.</p>";
                document.getElementById('last-update').innerText = "Sync: " + new Date().toLocaleTimeString();
                
                calculateRadar(teamDataForRadar);
                
                const sortedTypes = Object.entries(typeCounts).sort((a,b) => b[1]-a[1]);
                document.getElementById('type-distribution').innerHTML = sortedTypes.map(e => `<div class="type-stat-card" style="border-left-color: \${typeColors[e[0]] || '#555'}"><b style="color:\${typeColors[e[0]]}">\${e[0].toUpperCase()}: \${e[1]}x</b></div>`).join('') || "Keine Daten.";
                
                // Rendert die neuen Riirex & Zepho Balken
                const renderBarUI = (id, data) => {
                    if(!data || data.length < 2) return;
                    const stats = data.slice(1);
                    const total = stats.reduce((a,b) => a + (parseInt(b[1])||0), 0);
                    
                    document.getElementById(id).innerHTML = stats.map(r => {
                        const barClass = r[0].toLowerCase().includes('riirex') ? 'riirex-bar' : 'zepho-bar';
                        return `
                        <div class="stat-row">
                            <div class="stat-label"><span>\${r[0]}</span><span>\${r[1]}</span></div>
                            <div class="bar-bg"><div class="bar-fill \${barClass}" style="width:\${total ? (r[1]/total*100) : 0}%"></div></div>
                        </div>`;
                    }).join('');
                };
                renderBarUI('death-bars', json.stats.deaths);
                renderBarUI('wipeout-bars', json.stats.wipeouts);

                bar.style.width = "100%";
                setTimeout(() => bar.style.width = "0%", 1000);
            } catch (e) { console.error(e); bar.style.backgroundColor = "red"; }
        }

        // Automatischer Erstaufruf beim Laden der Seite
        window.onload = update;
    </script>
</body>
</html>
